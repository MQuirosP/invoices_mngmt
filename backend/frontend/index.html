<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Facturas</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <h1>Gestión de Facturas OCR</h1>
      <nav>
        <button id="scanBtn" class="active">Escanear factura</button>
        <button id="historyBtn">Ver historial</button>
      </nav>
    </header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="#">OCR Facturas</a>
      <div class="navbar-nav">
        <button id="scanBtn" class="btn btn-outline-light me-2">
          Escanear
        </button>
        <button id="historyBtn" class="btn btn-outline-light me-2">
          Historial
        </button>
      </div>
      <div class="ms-auto">
        <button id="loginBtn" class="btn btn-success me-2">Login</button>
        <button id="logoutBtn" class="btn btn-danger d-none">Logout</button>
      </div>
    </nav>

    <div class="container">
      <div class="auth-section">
        <input type="password" id="tokenInput" placeholder="Token de acceso" />
      </div>

      <div id="scanSection">
        <div class="upload-section">
          <input
            type="file"
            id="fileInput"
            class="form-control mb-2"
            accept="image/*"
          />
          <button id="uploadBtn" class="btn btn-success">
            Procesar imagen
          </button>
        </div>

        <div id="loading" class="hidden">Procesando imagen...</div>

        <div id="results" class="hidden">
          <h2>Factura extraída</h2>
          <p><strong>Proveedor:</strong> <span id="provider"></span></p>
          <p><strong>Fecha de emisión:</strong> <span id="issueDate"></span></p>

          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Total</th>
                <th>Garantía</th>
              </tr>
            </thead>
            <tbody id="itemsTable"></tbody>
          </table>
        </div>
      </div>

      <div id="historySection" class="hidden">
        <h2>Historial de facturas</h2>
        <table>
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Fecha</th>
              <th>Ítems</th>
              <th>Adjunto</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>
    <!-- Modal para ver factura -->
    <div
      class="modal fade"
      id="invoiceModal"
      tabindex="-1"
      aria-labelledby="invoiceModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="invoiceModalLabel">Factura adjunta</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body text-center">
            <img id="invoiceImage" src="" alt="Factura" class="img-fluid" />
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Autenticación</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="password"
              id="tokenInput"
              class="form-control"
              placeholder="Token de acceso"
            />
          </div>
          <div class="modal-footer">
            <button type="button" id="confirmLoginBtn" class="btn btn-primary">
              Ingresar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-danger text-white">
          <div class="modal-header">
            <h5 class="modal-title">Error</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="errorMessage"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
