<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de facturas OCR</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 🧭 Navbar principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4">
      <a class="navbar-brand" href="#">OCR Facturas</a>
      <div class="navbar-nav">
        <button id="scanBtn" class="btn btn-outline-light me-2">
          Escanear
        </button>
        <button id="historyBtn" class="btn btn-outline-light me-2">
          Historial
        </button>
      </div>
      <div class="ms-auto">
        <button id="loginBtn" class="btn btn-success me-2">Login</button>
        <button id="logoutBtn" class="btn btn-danger d-none">Logout</button>
        <button id="registerBtn" class="btn btn-outline-info me-2">
          Registro
        </button>
        <div class="ms-auto d-flex align-items-center">
          <button id="loginBtn" class="btn btn-success me-2">Login</button>
          <button id="logoutBtn" class="btn btn-danger d-none">Logout</button>
          <span
            id="userGreeting"
            class="text-light fw-semibold ms-3 d-none"
          ></span>
        </div>
      </div>
    </nav>

    <!-- 📦 Contenedor principal -->
    <div class="container">
      <!-- 🔍 Sección de escaneo -->
      <section id="scanSection">
        <h2>Escanear factura</h2>
        <div class="upload-section mb-4">
          <input
            type="file"
            id="fileInput"
            class="form-control mb-2"
            accept="image/*"
          />
          <button id="uploadBtn" class="btn btn-success">
            Procesar imagen
          </button>
        </div>
        <div id="loading" class="hidden">Procesando imagen...</div>

        <div id="results" class="hidden">
          <h3>Factura extraída</h3>
          <p><strong>Proveedor:</strong> <span id="provider"></span></p>
          <p><strong>Fecha de emisión:</strong> <span id="issueDate"></span></p>
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Total</th>
                <th>Garantía</th>
              </tr>
            </thead>
            <tbody id="itemsTable"></tbody>
          </table>
        </div>
      </section>

      <!-- 📜 Sección de historial -->
      <section id="historySection" class="hidden">
        <h2>Historial de facturas</h2>
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Fecha</th>
              <th>Ítems</th>
              <th>Adjunto</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </section>
    </div>

    <!-- 🧾 Modal: Ver factura -->
    <div
      class="modal fade"
      id="invoiceModal"
      tabindex="-1"
      aria-labelledby="invoiceModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="invoiceModalLabel">Factura adjunta</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body text-center">
            <img id="invoiceImage" src="" alt="Factura" class="img-fluid" />
          </div>
        </div>
      </div>
    </div>

    <!-- 🧑 Modal: Registro -->
    <div
      class="modal fade"
      id="registerModal"
      tabindex="-1"
      aria-labelledby="registerModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Registro de usuario</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="email"
              id="registerEmail"
              class="form-control mb-2"
              placeholder="Correo electrónico"
            />
            <input
              type="text"
              id="registerFullname"
              class="form-control mb-2"
              placeholder="Nombre completo"
            />
            <input
              type="password"
              id="registerPassword"
              class="form-control mb-2"
              placeholder="Contraseña"
            />
            <input
              type="password"
              id="registerConfirm"
              class="form-control"
              placeholder="Confirmar contraseña"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="confirmRegisterBtn"
              class="btn btn-primary"
            >
              Registrarse
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 🔐 Modal: Login -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Iniciar sesión</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="email"
              id="loginEmail"
              class="form-control mb-2"
              placeholder="Correo electrónico"
            />
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Contraseña"
            />
          </div>
          <div class="modal-footer">
            <button type="button" id="confirmLoginBtn" class="btn btn-primary">
              Ingresar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ⚠️ Modal: Error -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-danger text-white">
          <div class="modal-header">
            <h5 class="modal-title">Error</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="errorMessage"></div>
        </div>
      </div>
    </div>

    <!-- 📦 Scripts -->
    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
