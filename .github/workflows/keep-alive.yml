name: Keep Render and DB Alive

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Job ID
        run: echo "JOB_ID=keep-alive-$(date +%s)" >> $GITHUB_ENV

      - name: Curl to keep service alive
        run: |
          CODE=$(curl --write-out "%{http_code}" --silent --output /dev/null https://invoices-mngmt.onrender.com/api/ping \
            -H "X-Job-ID: $JOB_ID" \
            -H "X-Env: dev")
          echo "Ping response code: $CODE"
          if [ "$CODE" -ge 400 ]; then
            echo "Ping failed with HTTP $CODE"
            exit 1
          fi

      - name: Curl to wake up DB
        run: |
          echo "Pinging DB health check with Job ID: $JOB_ID"
          curl --fail --silent https://invoices-mngmt.onrender.com/api/health/db \
            -H "X-Job-ID: $JOB_ID"
      - name: Confirm workflow execution
        run: echo "Workflow Keep Render and DB Alive executed at $(date)"
